# Hallituksen vuosikello. Lakisääteinen runko on valmiina (items). Hallituksen
# valvonta- ja kehitysasiat ovat optional_catalog-listassa: agentti tarjoaa ne
# käyttöönotossa (ALOITUS.md, vaihe 7) yhtiökohtaisesti valittaviksi, eikä yhtään
# niistä aseteta pakolliseksi. Valittu asia siirretään items-listaan. Kuukausi = milloin asia on käsiteltävä
# viimeistään; null = sidottu tapahtumaan, ei kuukauteen.
schema_version: 2
record_type: annual_cycle
status: provisional               # provisional | formally_approved (hallitus hyväksynyt)
fiscal_year_end_month: null       # täytä; lakisääteiset määräajat lasketaan tästä

items:
  # --- Lakisääteiset (OYL) ---
  - id: VK-01
    topic: Tilinpäätöksen ja toimintakertomuksen käsittely ja allekirjoitus
    basis: "KPL 3:6 § — neljän kuukauden kuluessa tilikauden päättymisestä; OYL 6:2 §"
    month: null                   # tilikauden päättymiskuukausi + 4
    decision_required: true
    recurring: yearly
  - id: VK-02
    topic: Varsinaisen yhtiökokouksen valmistelu ja koolle kutsuminen
    basis: "OYL 5:3 § — kuuden kuukauden kuluessa tilikauden päättymisestä"
    month: null                   # tilikauden päättymiskuukausi + 5 tai 6
    decision_required: true
    recurring: yearly
  - id: VK-03
    topic: Voitonjakoesitys yhtiökokoukselle
    basis: "OYL 13 luku — maksukykyisyysarvio kirjataan"
    month: null
    decision_required: true
    recurring: yearly
  - id: VK-04
    topic: Hallituksen järjestäytyminen yhtiökokouksen jälkeen (pj, vpj)
    basis: "OYL 6:8 §"
    month: null                   # heti yhtiökokouksen jälkeen
    decision_required: true
    recurring: yearly

  # --- Työtilan omat toistuvat asiat ---
  - id: VK-05
    topic: Yhtiökokouksen pöytäkirjan läpikäynti — hallitusta koskevat velvoitteet ja valtuutukset
    basis: "Työtila: company/toimivallan-rajat.yaml päivitetään; kokoonpanorekisteriin uusi toimikausi"
    month: null                   # yhtiökokouksen jälkeen
    decision_required: false
    recurring: yearly
  - id: VK-06
    topic: Hallituksen itsearviointi
    basis: "Keskuskauppakamarin asialuettelo: arviointi ennen hallitusjäsenten valintaa"
    month: null                   # ennen yhtiökokousta
    decision_required: false
    recurring: yearly
  - id: VK-07
    topic: Allekirjoitettujen pöytäkirjojen kuittaus rekisteriin
    basis: "Työtila: decision_text_status odottaa_allekirjoitusta → kopio"
    month: null
    decision_required: false
    recurring: after_each_meeting


# ---------------------------------------------------------------- valinnaiset
# Ei pakollisia. Agentti kysyy käyttöönotossa jokaisesta: otetaanko vuosikelloon?
# Kun otetaan: siirrä items-listaan, anna kuukausi ja päivitä adopted: true.
optional_catalog:
  - {id: VK-OPT-01, topic: "Budjetti ja tavoitteet seuraavalle vuodelle", recurring: yearly, decision_required: true, adopted: false}
  - {id: VK-OPT-02, topic: "Ennuste, kassavirta ja maksuvalmius", recurring: quarterly, decision_required: false, adopted: false}
  - {id: VK-OPT-03, topic: "Strategian seuranta ja tarkistus (strategiapäivä)", recurring: yearly, decision_required: mahdollinen, adopted: false}
  - {id: VK-OPT-04, topic: "Riskit ja mahdollisuudet", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-05, topic: "Vakuutusten kattavuus", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-06, topic: "Sisäinen valvonta ja kirjanpidon järjestäminen (OYL 6:2 §)", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-07, topic: "Lähipiiritapahtumat ja esteellisyyksien kartoitus", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-08, topic: "Toimitusjohtajan tavoitteet ja arviointi", recurring: yearly, decision_required: mahdollinen, adopted: false}
  - {id: VK-OPT-09, topic: "Seuraajasuunnittelu (toimitusjohtaja, avainhenkilöt)", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-10, topic: "Tietoturva ja toiminnan jatkuvuus", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-11, topic: "Henkilöstön avainriskit", recurring: yearly, decision_required: false, adopted: false}
  - {id: VK-OPT-12, topic: "Merkittävät investoinnit ja sopimukset — hyväksyntärajojen tarkistus", recurring: yearly, decision_required: mahdollinen, adopted: false}
  - {id: VK-OPT-13, topic: "Työtilan käyttöoikeuksien ja varmuuskopioiden tarkistus", basis: "governance/07", recurring: yearly, decision_required: false, adopted: false}

open_items: []
